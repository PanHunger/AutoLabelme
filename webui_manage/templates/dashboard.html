{% extends "base.html" %}

{% block content %}
<div class="row">
    <div class="col-12">
        <h1 class="mb-4"><i class="bi bi-speedometer2"></i> 服务器监控面板</h1>
    </div>
</div>

<!-- 系统概览 -->
<div class="row mb-4">
    <div class="col-md-3">
        <div class="card text-white bg-primary">
            <div class="card-body">
                <h5 class="card-title">CPU使用率</h5>
                <h2 id="cpu-usage">--%</h2>
                <p class="card-text" id="cpu-info">核心: --</p>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card text-white bg-success">
            <div class="card-body">
                <h5 class="card-title">内存使用率</h5>
                <h2 id="memory-usage">--%</h2>
                <p class="card-text" id="memory-info">已用: -- GB</p>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card text-white bg-warning">
            <div class="card-body">
                <h5 class="card-title">GPU使用率</h5>
                <h2 id="gpu-usage">--%</h2>
                <p class="card-text" id="gpu-info">温度: --°C</p>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card text-white bg-info">
            <div class="card-body">
                <h5 class="card-title">磁盘使用率</h5>
                <h2 id="disk-usage">--%</h2>
                <p class="card-text" id="disk-info">已用: -- GB</p>
            </div>
        </div>
    </div>
</div>

<!-- 详细监控信息 -->
<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-header">
                <ul class="nav nav-tabs card-header-tabs" id="monitorTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="cpu-memory-tab" data-bs-toggle="tab" 
                                data-bs-target="#cpu-memory" type="button" role="tab">
                            CPU/内存
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="gpu-tab" data-bs-toggle="tab" 
                                data-bs-target="#gpu" type="button" role="tab">
                            GPU
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="disk-tab" data-bs-toggle="tab" 
                                data-bs-target="#disk" type="button" role="tab">
                            磁盘
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="network-tab" data-bs-toggle="tab" 
                                data-bs-target="#network" type="button" role="tab">
                            网络/温度
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="process-tab" data-bs-toggle="tab" 
                                data-bs-target="#process" type="button" role="tab">
                            进程
                        </button>
                    </li>
                </ul>
            </div>
            <div class="card-body">
                <div class="tab-content" id="monitorTabsContent">
                    <!-- CPU/内存标签页 -->
                    <div class="tab-pane fade show active" id="cpu-memory" role="tabpanel">
                        <div class="row">
                            <div class="col-md-6">
                                <h5>CPU信息</h5>
                                <div id="cpu-details">
                                    <!-- CPU详情将通过JavaScript填充 -->
                                </div>
                                <div class="mt-3">
                                    <label>CPU使用率</label>
                                    <div class="progress">
                                        <div id="cpu-progress" class="progress-bar" role="progressbar"></div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <h5>内存信息</h5>
                                <div id="memory-details">
                                    <!-- 内存详情将通过JavaScript填充 -->
                                </div>
                                <div class="mt-3">
                                    <label>内存使用率</label>
                                    <div class="progress">
                                        <div id="memory-progress" class="progress-bar" role="progressbar"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- GPU标签页 -->
                    <div class="tab-pane fade" id="gpu" role="tabpanel">
                        <div id="gpu-details">
                            <!-- GPU详情将通过JavaScript填充 -->
                        </div>
                    </div>
                    
                    <!-- 磁盘标签页 -->
                    <div class="tab-pane fade" id="disk" role="tabpanel">
                        <div id="disk-details">
                            <!-- 磁盘详情将通过JavaScript填充 -->
                        </div>
                    </div>
                    
                    <!-- 网络/温度标签页 -->
                    <div class="tab-pane fade" id="network" role="tabpanel">
                        <div class="row">
                            <div class="col-md-6">
                                <h5>网络信息</h5>
                                <div id="network-details">
                                    <!-- 网络详情将通过JavaScript填充 -->
                                </div>
                            </div>
                            <div class="col-md-6">
                                <h5>温度信息</h5>
                                <div id="temperature-details">
                                    <!-- 温度详情将通过JavaScript填充 -->
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 进程标签页 -->
                    <div class="tab-pane fade" id="process" role="tabpanel">
                        <h5>资源占用最高的进程</h5>
                        <div class="table-responsive">
                            <table class="table table-striped">
                                <thead>
                                    <tr>
                                        <th>PID</th>
                                        <th>名称</th>
                                        <th>CPU使用率</th>
                                        <th>内存使用率</th>
                                    </tr>
                                </thead>
                                <tbody id="process-list">
                                    <!-- 进程列表将通过JavaScript填充 -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 刷新控制 -->
<div class="row mt-3">
    <div class="col-12">
        <div class="card">
            <div class="card-body">
                <div class="row align-items-center">
                    <div class="col-md-6">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="autoRefresh" checked>
                            <label class="form-check-label" for="autoRefresh">自动刷新</label>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <select class="form-select" id="refreshInterval">
                            <option value="1">1秒</option>
                            <option value="3">3秒</option>
                            <option value="5" selected>5秒</option>
                            <option value="10">10秒</option>
                            <option value="30">30秒</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-primary w-100" id="refreshNow">立即刷新</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // 监控面板的JavaScript代码将在script.js中实现
</script>
{% endblock %}
