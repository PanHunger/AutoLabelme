{% extends "base.html" %}

{% block content %}
<div class="row">
    <div class="col-12">
        <h1 class="mb-4"><i class="bi bi-code-slash"></i> Python环境管理</h1>
    </div>
</div>

<div class="row">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h5 class="card-title mb-0">添加虚拟环境</h5>
            </div>
            <div class="card-body">
                <form id="addEnvForm">
                    <div class="mb-3">
                        <label for="envName" class="form-label">环境名称</label>
                        <input type="text" class="form-control" id="envName" required>
                    </div>
                    <div class="mb-3">
                        <label for="envPath" class="form-label">虚拟环境路径</label>
                        <input type="text" class="form-control" id="envPath" required>
                        <div class="form-text">例如: /home/user/venv 或 C:\Users\user\venv</div>
                    </div>
                    <button type="submit" class="btn btn-primary">添加环境</button>
                </form>
            </div>
        </div>
    </div>
    
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h5 class="card-title mb-0">已配置的环境</h5>
            </div>
            <div class="card-body">
                <div id="envList">
                    <!-- 环境列表将通过JavaScript填充 -->
                </div>
            </div>
        </div>
    </div>
</div>

<div class="row mt-4">
    <div class="col-12">
        <div class="card">
            <div class="card-header">
                <h5 class="card-title mb-0">环境状态检查</h5>
            </div>
            <div class="card-body">
                <div id="envStatus">
                    <!-- 环境状态将通过JavaScript填充 -->
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // 环境管理的JavaScript代码将在script.js中实现
</script>
{% endblock %}
