{% extends "base.html" %}

{% block content %}
<div class="row">
    <div class="col-12">
        <h1 class="mb-4"><i class="bi bi-clock"></i> 任务调度</h1>
    </div>
</div>

<div class="row">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h5 class="card-title mb-0">添加定时任务</h5>
            </div>
            <div class="card-body">
                <form id="taskForm">
                    <div class="mb-3">
                        <label for="taskName" class="form-label">任务名称</label>
                        <input type="text" class="form-control" id="taskName" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="taskDescription" class="form-label">任务描述</label>
                        <textarea class="form-control" id="taskDescription" rows="2"></textarea>
                    </div>
                    
                    <div class="mb-3">
                        <label for="scheduleType" class="form-label">调度类型</label>
                        <select class="form-select" id="scheduleType" required>
                            <option value="once">一次性</option>
                            <option value="daily">每日</option>
                            <option value="weekly">每周</option>
                            <option value="monthly">每月</option>
                            <option value="cron">自定义cron表达式</option>
                        </select>
                    </div>
                    
                    <div id="scheduleOptions">
                        <!-- 动态调度选项将在这里显示 -->
                    </div>
                    
                    <div class="mb-3">
                        <label for="taskAction" class="form-label">任务操作</label>
                        <select class="form-select" id="taskAction" required>
                            <option value="script">执行脚本</option>
                            <option value="command">系统命令</option>
                            <option value="notification">发送通知</option>
                            <option value="backup">备份操作</option>
                        </select>
                    </div>
                    
                    <div id="actionOptions">
                        <!-- 动态操作选项将在这里显示 -->
                    </div>
                    
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="taskEnabled" checked>
                        <label class="form-check-label" for="taskEnabled">启用任务</label>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">添加任务</button>
                </form>
            </div>
        </div>
        
        <div class="card mt-4">
            <div class="card-header">
                <h5 class="card-title mb-0">任务历史</h5>
            </div>
            <div class="card-body">
                <div id="taskHistory">
                    <div class="alert alert-info">
                        <i class="bi bi-info-circle"></i> 暂无任务执行历史
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h5 class="card-title mb-0">已调度任务</h5>
            </div>
            <div class="card-body">
                <div id="scheduledTasks">
                    <div class="alert alert-info">
                        <i class="bi bi-info-circle"></i> 暂无已调度的任务
                    </div>
                </div>
            </div>
        </div>
        
        <div class="card mt-4">
            <div class="card-header">
                <h5 class="card-title mb-0">快速任务模板</h5>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6 mb-2">
                        <button class="btn btn-outline-primary w-100 quick-task-btn" data-template="cleanup">
                            <i class="bi bi-trash"></i> 清理临时文件
                        </button>
                    </div>
                    <div class="col-md-6 mb-2">
                        <button class="btn btn-outline-success w-100 quick-task-btn" data-template="backup">
                            <i class="bi bi-archive"></i> 自动备份
                        </button>
                    </div>
                    <div class="col-md-6 mb-2">
                        <button class="btn btn-outline-warning w-100 quick-task-btn" data-template="monitor">
                            <i class="bi bi-graph-up"></i> 系统监控
                        </button>
                    </div>
                    <div class="col-md-6 mb-2">
                        <button class="btn btn-outline-info w-100 quick-task-btn" data-template="report">
                            <i class="bi bi-file-text"></i> 生成报告
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 任务执行日志模态框 -->
<div class="modal fade" id="taskLogModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">任务执行日志</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <pre id="taskLogContent" class="bg-light p-3" style="max-height: 400px; overflow-y: auto;"></pre>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        initScheduling();
    });
</script>
{% endblock %}
